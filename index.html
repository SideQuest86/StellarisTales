<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#08151a" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      data-i18n-content="site.description"
      content="完整收录《群星》游戏内的故事文本，附原版配乐。Every story from the game Stellaris, with the original soundtrack."
    />
    <!-- Link previews (chat apps, social cards): the page's own name and description, and a 1200x630 card of the archive
         itself (public/share-card.jpg, rendered from the site: the 3D wall and the wordmark, no interface text). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Stellaris Tales" />
    <meta property="og:title" content="Stellaris Tales" />
    <meta
      property="og:description"
      data-i18n-content="site.description"
      content="完整收录《群星》游戏内的故事文本，附原版配乐。Every story from the game Stellaris, with the original soundtrack."
    />
    <meta property="og:url" content="https://sidequest86.github.io/StellarisTales/" />
    <meta property="og:image" content="https://sidequest86.github.io/StellarisTales/share-card.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Stellaris Tales: the story archive as a wall of illustrated cards" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://sidequest86.github.io/StellarisTales/share-card.jpg" />
    <title>Stellaris Tales</title>
    <link rel="icon" href="./public/mark.svg" />
    <link rel="apple-touch-icon" href="./public/apple-touch-icon.png" />
    <!--
      Fonts. The Chinese faces (Noto Serif SC 400/600, Noto Sans SC 400/500; SIL OFL) are self-hosted subsets in
      public/fonts/ (scripts/fonts/build-subsets.py, docs/refine/round6/fonts.md): three unicode-range tiers per face
      declared in src/fonts.css, so a page downloads only the tiers whose characters it shows. fonts.css is local and
      small, so the @font-face rules are declared before the app runs (src/glyph-warmup.js relies on that); the first
      tier of the two faces the first paint uses is preloaded. If a font file fails, the font stacks in style.css fall
      back to system CJK fonts (PingFang SC, Microsoft YaHei, Source Han, Songti, SimSun).
      Newsreader (Latin, English reading text) is self-hosted too (src/newsreader.css: two variable woff2 files, 200 KB),
      so no third-party font host is involved (Google Fonts was unreachable in mainland China); first paint uses the
      metric-matched local fallback ("ST Serif Fallback") and swaps when the face arrives.
    -->
    <link rel="preload" href="./public/fonts/noto-sans-sc-400-t1.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="./public/fonts/noto-serif-sc-400-t1.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="./public/fonts/newsreader-roman.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="./src/fonts.css" />
    <link rel="stylesheet" href="./src/newsreader.css" />
    <link rel="stylesheet" href="./src/style.css" />
    <link rel="stylesheet" href="./src/reader-extras.css" />
    <link rel="stylesheet" href="./src/effects-panel.css" />
    <!-- The archive index is the first request the app script makes: start it with the page, not after the script has loaded. -->
    <link rel="preload" href="./public/stories/index.json" as="fetch" crossorigin />
    <!-- The 3D engine is discovered late through app.js → archive-scene.js; fetch it in parallel. -->
    <link rel="modulepreload" href="./vendor/three.module.js" />
    <link rel="modulepreload" href="./vendor/three.core.js" />
    <link rel="modulepreload" href="./src/archive-scene.js" />
    <link rel="modulepreload" href="./src/gpu.js" />
    <script>
      // Apply stored preferences before first paint: no flash of the wrong language or motion. Without a stored choice the
      // browser's languages decide: the first Chinese or English one wins, anything else reads in English (app.js takes the
      // language from <html lang> set here; only the 中 / EN switch stores a choice).
      var stored = null;
      try {
        stored = localStorage.getItem("st-language");
      } catch (e) {}
      var browserLanguage = (function () {
        var list = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || ""];
        for (var i = 0; i < list.length; i++) {
          var l = String(list[i]).toLowerCase();
          if (l.indexOf("zh") === 0) return "zh";
          if (l.indexOf("en") === 0) return "en";
        }
        return "en";
      })();
      try {
        if ((stored === "zh" || stored === "en" ? stored : browserLanguage) === "en") {
          document.documentElement.lang = "en";
          // The markup's words are Chinese until app.js translates them: keep them out of sight until then (3 s at most).
          document.documentElement.classList.add("i18n-pending");
          setTimeout(function () { document.documentElement.classList.remove("i18n-pending"); }, 3000);
        }
        if (localStorage.getItem("st-motion") === "reduced") document.documentElement.classList.add("reduced-motion");
      } catch (e) {}
    </script>
  </head>
  <body>
    <a class="skip-link" href="#archive-hud" data-i18n="archive.skip">跳到故事选择</a>
    <header class="masthead">
      <a href="#" class="brand" data-i18n-aria="brand.home" aria-label="Stellaris Tales 首页"
        ><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M20 3 36 31H4Z M20 12v25 M8 25h24" /></svg
        ><span class="brand-type"
          >Stellaris Tales</span
        ></a
      >
      <nav id="categories" class="catalogue" data-i18n-aria="catalogue.label" aria-label="故事类别"></nav>
      <div class="header-actions">
        <button id="search-open" type="button" data-i18n-aria="header.search" aria-label="搜索"><span aria-hidden="true">⌕</span> <span data-i18n="header.search">搜索</span></button
        ><button id="language" type="button" data-i18n="header.language" data-i18n-aria="header.languageLabel" aria-label="切换为英文">中 / EN</button
        ><button id="motion" type="button" aria-pressed="false" data-i18n="motion.reduce">减少动态</button>
      </div>
    </header>
    <main id="archive">
      <div id="scene" class="scene">
        <div id="scene-fallback" hidden data-i18n="scene.fallback">可用分类和方向按钮浏览。</div>
      </div>
      <div class="scene-vignette" aria-hidden="true"></div>
      <div class="archive-hud" id="archive-hud">
        <div class="selection">
          <div class="selection-eyebrow">
            <span id="category-label">深空异闻</span><i aria-hidden="true"></i><span id="chapter-count"></span><i aria-hidden="true" id="read-sep" hidden></i><span id="read-count" hidden></span>
          </div>
          <h1 id="selected-title" data-i18n="archive.loadingTitle">载入中</h1>
          <p id="selected-excerpt"></p>
          <div id="story-specimens" class="story-specimens" hidden></div>
          <button id="open-story" class="access" type="button"
            ><span data-i18n="archive.open">展开故事</span> <span aria-hidden="true">↗</span></button
          >
        </div>
        <div class="navigation">
          <div class="row-navigation">
            <div class="row-counter"><b id="story-number">01</b><span id="story-total">/ —</span></div>
            <button id="previous-story" type="button" data-i18n-aria="archive.previousStory" aria-label="上一则故事">↑</button
            ><button id="next-story" type="button" data-i18n-aria="archive.nextStory" aria-label="下一则故事">↓</button>
          </div>
          <div class="lane-navigation">
            <button id="previous-category" type="button" data-i18n-aria="archive.previousCategory" aria-label="上一个类别">←</button
            ><button id="next-category" type="button" data-i18n-aria="archive.nextCategory" aria-label="下一个类别">→</button>
          </div>
        </div>
      </div>
      <div class="archive-count" id="archive-count"></div>
    </main>
    <section id="reader" hidden aria-labelledby="reader-title" data-i18n-aria="reader.label">
      <div class="reader-left">
        <p id="dossier-title"></p>
        <span id="dossier-size"></span>
      </div>
      <aside id="flow-surface" hidden data-i18n-aria="reader.routeLabel" aria-label="档案剧情路线"></aside>
      <div class="reader-panel">
        <div class="reader-toolbar">
          <button id="close-reader" type="button"><span aria-hidden="true">←</span> <span data-i18n="reader.close">收起档案</span></button>
          <div>
            <button id="chapter-toggle" type="button" aria-expanded="false" data-i18n="reader.map">剧情脉络</button
            ><button id="reader-language" type="button" data-i18n="reader.languageShort" data-i18n-aria="reader.languageLabel" aria-label="切换为英文">EN</button>
          </div>
        </div>
        <nav id="chapter-list" hidden data-i18n-aria="reader.chapterList" aria-label="故事篇章"></nav>
        <div id="reading-content"></div>
      </div>
    </section>
    <footer class="music-player" id="music-player">
      <div class="playing-track">
        <img id="album-cover" data-i18n-alt="music.cover" alt="群星原声专辑封面" width="43" height="43" />
        <div>
          <button id="playlist-toggle" type="button" aria-expanded="false" aria-controls="playlist">
            <span id="track-title">Faster Than Light</span><span class="caret" aria-hidden="true"></span></button
          ><small id="track-artist"></small>
        </div>
      </div>
      <div class="transport">
        <button id="track-previous" type="button" data-i18n-aria="music.previous" aria-label="上一首">‹</button
        ><button id="play-pause" type="button" data-i18n-aria="music.play" aria-label="播放音乐">▶</button
        ><button id="track-next" type="button" data-i18n-aria="music.next" aria-label="下一首">›</button>
      </div>
      <div class="seek">
        <span id="elapsed">0:00</span
        ><input id="music-seek" type="range" min="0" max="1000" value="0" data-i18n-aria="music.seek" aria-label="音乐进度" /><span
          id="duration"
          >0:00</span
        >
      </div>
      <div class="volume">
        <span aria-hidden="true">♫</span
        ><input id="music-volume" type="range" min="0" max="100" value="28" data-i18n-aria="music.volume" aria-label="音乐音量" />
      </div>
      <audio id="ost-audio" preload="none"></audio>
    </footer>
    <section id="playlist" hidden data-i18n-aria="music.playlist" aria-label="原声列表">
      <div class="playlist-heading">
        <div>
          <h2 data-i18n="music.playlistTitle">原声</h2>
        </div>
        <button id="playlist-close" type="button" data-i18n-aria="music.playlistClose" aria-label="关闭音乐列表">×</button>
      </div>
      <p id="playlist-description"></p>
      <div id="track-list"></div>
    </section>
    <dialog id="search-dialog" aria-labelledby="search-title">
      <div class="search-heading">
        <h2 id="search-title" data-i18n="search.title">搜索</h2>
        <button id="search-close" type="button" data-i18n-aria="search.close" aria-label="关闭搜索">×</button>
      </div>
      <label class="search-field"
        ><span aria-hidden="true">⌕</span
        ><input
          id="search-input"
          type="search"
          data-i18n-placeholder="search.placeholder"
          placeholder="故事名称、中文或英文关键词"
          data-i18n-aria="search.label"
          aria-label="搜索故事" /></label
      ><span id="search-count" role="status"></span>
      <div id="search-results"></div>
      <div class="search-pager">
        <button id="search-previous" type="button" data-i18n-aria="search.previous" aria-label="上一页">←</button
        ><span id="search-page" aria-live="polite"></span
        ><button id="search-next" type="button" data-i18n-aria="search.next" aria-label="下一页">→</button>
      </div>
    </dialog>
    <div id="toast" role="status"></div>
    <script type="module" src="./src/app.js"></script>
  </body>
</html>
