<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0c181d" />
    <meta
      name="description"
      content="穿行于银河档案阵列，展开完整群星故事，在原版配乐中探索每一个选择。"
    />
    <title>群星 · 银河记忆 | Stellaris Tales</title>
    <link rel="icon" href="./public/mark.svg" />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <header class="masthead">
      <a href="#" class="brand" aria-label="群星档案馆首页"
        ><svg viewBox="0 0 40 40" aria-hidden="true">
          <path d="M20 3 36 31H4Z M20 12v25 M8 25h24" /></svg
        ><span>STELLARIS<small>银河叙事档案</small><b>TALES</b></span></a
      >
      <div class="header-actions">
        <button id="search-open">⌕ <span>搜索</span></button
        ><button id="language">中 / EN</button
        ><button id="motion" aria-pressed="false">减少动态</button>
      </div>
    </header>
    <main id="archive">
      <nav id="categories" aria-label="故事类别"></nav>
      <div id="scene" class="scene">
        <div id="scene-fallback" hidden>
          档案已准备好。使用分类与方向按钮继续探索。
        </div>
      </div>
      <div class="scene-vignette" aria-hidden="true"></div>

      <div class="archive-hud" id="archive-hud">
        <div class="selection">
          <div class="selection-eyebrow">
            <span id="category-label">深空异闻</span><i></i
            ><span id="chapter-count"></span>
          </div>
          <h1 id="selected-title">群星之间</h1>
          <p id="selected-excerpt"></p>
          <button id="open-story" class="access">
            展开故事 <span>↗</span>
          </button>
        </div>
        <div class="navigation">
          <div class="row-navigation">
            <button id="previous-story" aria-label="上一份故事">↑</button>
            <div>
              <b id="story-number">01</b><span id="story-total">/ —</span>
            </div>
            <button id="next-story" aria-label="下一份故事">↓</button>
          </div>
          <span class="navigation-hint"
            >上下滑动 · 翻阅故事<br />左右拖动 · 穿行类别</span
          >
          <div class="lane-navigation">
            <button id="previous-category" aria-label="上一个类别">←</button
            ><span>切换类别</span
            ><button id="next-category" aria-label="下一个类别">→</button>
          </div>
        </div>
      </div>
      <div class="archive-count" id="archive-count"></div>
    </main>
    <section id="reader" hidden aria-labelledby="reader-title">
      <div class="reader-left">
        <h2 id="dossier-title"></h2>
        <span id="dossier-size"></span>
      </div>
      <div class="reader-panel">
        <div class="reader-toolbar">
          <button id="close-reader">← 收起档案</button>
          <div>
            <button id="chapter-toggle" aria-expanded="false">剧情脉络</button
            ><button id="reader-language">EN</button>
          </div>
        </div>
        <nav id="chapter-list" hidden aria-label="故事篇章"></nav>
        <div id="reading-content"></div>
      </div>
    </section>
    <footer class="music-player" id="music-player">
      <div class="playing-track">
        <img id="album-cover" alt="群星原声专辑封面" />
        <div>
          <span class="music-overline">STELLARIS ORIGINAL SOUNDTRACK</span
          ><button id="playlist-toggle" aria-expanded="false">
            <span id="track-title">群星原声音乐集</span><span>⌃</span></button
          ><small id="track-artist"></small>
        </div>
      </div>
      <div class="transport">
        <button id="track-previous" aria-label="上一首">‹</button
        ><button id="play-pause" aria-label="播放音乐">▶</button
        ><button id="track-next" aria-label="下一首">›</button>
      </div>
      <div class="seek">
        <span id="elapsed">0:00</span
        ><input
          id="music-seek"
          type="range"
          min="0"
          max="1000"
          value="0"
          aria-label="音乐进度"
        /><span id="duration">0:00</span>
      </div>
      <div class="volume">
        <span aria-hidden="true">♫</span
        ><input
          id="music-volume"
          type="range"
          min="0"
          max="100"
          value="28"
          aria-label="音乐音量"
        />
      </div>
      <span class="loop-label" title="整张专辑循环播放"
        >↻<small>专辑循环</small></span
      ><audio id="ost-audio" preload="none"></audio>
    </footer>
    <section id="playlist" hidden aria-label="原声音乐播放列表">
      <div class="playlist-heading">
        <div>
          <span class="eyebrow">ORIGINAL SOUNDTRACK</span>
          <h2>原声</h2>
        </div>
        <button id="playlist-close" aria-label="关闭音乐列表">×</button>
      </div>
      <p id="playlist-description"></p>
      <div id="track-list"></div>
    </section>
    <dialog id="search-dialog" aria-labelledby="search-title">
      <div class="search-heading">
        <h2 id="search-title">搜索</h2>
        <button id="search-close" aria-label="关闭搜索">×</button>
      </div>
      <label class="search-field"
        ><span>⌕</span
        ><input
          id="search-input"
          type="search"
          placeholder="故事名称、中文或英文关键词"
          aria-label="搜索完整故事" /></label
      ><span id="search-count" role="status"></span>
      <div id="search-results"></div>
      <div class="search-pager">
        <button id="search-previous">←</button><span id="search-page"></span
        ><button id="search-next">→</button>
      </div>
    </dialog>
    <div id="toast" role="status"></div>
    <script type="module" src="./src/app.js"></script>
  </body>
</html>
