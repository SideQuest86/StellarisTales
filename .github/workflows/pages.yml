name: Publish story archive
# Deploys to GitHub Pages only for a release: a push to main that changes the RELEASE file (version + notes), or a
# manual run. Ongoing development on main is tracked by ci.yml without publishing. The github-pages environment only
# accepts deployments from main, so releases are made on main (tags are kept as records, not deploy triggers).
# Requires repository variable ENABLE_GITHUB_PAGES=true.
on:
  push:
    branches: [main]
    paths: [RELEASE]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          version: "11.19.0"
      - run: pnpm install --frozen-lockfile
      - run: npm test
      - run: node scripts/audit-categories.mjs
      - run: node scripts/review-summary.mjs >> "$GITHUB_STEP_SUMMARY"
      - run: npm run build
      # Release gate: browser smoke checks against the built site (scripts/smoke.mjs). A failure stops the job, so
      # nothing is uploaded or deployed.
      - name: Browser smoke checks
        run: |
          mkdir -p /tmp/pw && (cd /tmp/pw && npm init -y > /dev/null && npm install --silent --no-audit --no-fund playwright@1.62.1 && npx playwright install --with-deps chromium)
          node scripts/serve.mjs --port 4173 &
          sleep 2
          STELLARIS_PLAYWRIGHT_PATH=/tmp/pw/node_modules/playwright/index.mjs node scripts/smoke.mjs
      - uses: actions/configure-pages@v5
        if: vars.ENABLE_GITHUB_PAGES == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: vars.ENABLE_GITHUB_PAGES == 'true'
        with:
          path: dist
  deploy:
    if: vars.ENABLE_GITHUB_PAGES == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
