name: Archive CI
# Every push and pull request: tests, reproducible story compilation, category audit, build and a review-progress
# summary. Deployment is separate (pages.yml) and only happens for releases or manual runs.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          version: "11.19.0"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install --quiet pillow
      - name: Node tests
        run: node --test tests/*.test.mjs
      - name: Python tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Stories compile from authoring sources (generated JSON must not be hand-edited)
        run: |
          python scripts/compile-stories.py > /dev/null
          git diff --stat --exit-code -- public/stories public/summaries content || {
            echo "::error::public/stories differs from a fresh compile of content/ — edit fragments, then run scripts/compile-stories.py and commit the output."
            exit 1
          }
      - name: Category structure audit
        run: node scripts/audit-categories.mjs
      - name: Review progress summary
        run: node scripts/review-summary.mjs >> "$GITHUB_STEP_SUMMARY"
      - name: Build
        run: node scripts/build.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: stellaris-tales-site
          path: dist
          retention-days: 7
